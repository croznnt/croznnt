<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Animated Starry Night banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0a173a"/>
      <stop offset="35%" stop-color="#122c68"/>
      <stop offset="68%" stop-color="#1c3f8c"/>
      <stop offset="100%" stop-color="#0c2250"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff0bd" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffd877" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd877" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff8dc" stop-opacity="1"/>
      <stop offset="45%" stop-color="#ffe9a6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffe9a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hillGlow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#16356f"/>
      <stop offset="100%" stop-color="#081630"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>

    <style><![CDATA[
      @keyframes twinkle { 0%,100%{opacity:.35;transform:scale(.75)} 50%{opacity:1;transform:scale(1.2)} }
      @keyframes halo    { 0%,100%{opacity:.5;transform:scale(1)} 50%{opacity:.95;transform:scale(1.1)} }
      @keyframes ring    { 0%{opacity:.6;transform:scale(.6)} 100%{opacity:0;transform:scale(1.6)} }
      @keyframes driftA  { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-16px,5px)} }
      @keyframes driftB  { 0%,100%{transform:translate(0,0)} 50%{transform:translate(12px,-4px)} }
      @keyframes flow    { to { stroke-dashoffset:-900 } }
      @keyframes sway    { 0%,100%{transform:rotate(-1.6deg)} 50%{transform:rotate(1.8deg)} }
      @keyframes sway2   { 0%,100%{transform:rotate(1.4deg)} 50%{transform:rotate(-1.4deg)} }
      @keyframes flicker { 0%,100%{opacity:.9} 45%{opacity:.35} 70%{opacity:1} }
      .star   { transform-box:fill-box; transform-origin:center; animation:twinkle 3.4s ease-in-out infinite }
      .halo   { transform-box:fill-box; transform-origin:center; animation:halo 4.6s ease-in-out infinite }
      .ring   { transform-box:fill-box; transform-origin:center; animation:ring 4s ease-out infinite }
      .skyA   { animation:driftA 18s ease-in-out infinite }
      .skyB   { animation:driftB 22s ease-in-out infinite }
      .swirl  { stroke-dasharray:26 18; animation:flow 11s linear infinite }
      .current{ stroke-dasharray:40 26; animation:flow 16s linear infinite }
      .cypA   { transform-box:fill-box; transform-origin:110px 420px; animation:sway 7.5s ease-in-out infinite }
      .cypB   { transform-box:fill-box; transform-origin:1010px 420px; animation:sway2 9s ease-in-out infinite }
      .win    { animation:flicker 5s ease-in-out infinite }
      @media (prefers-reduced-motion:reduce){ * { animation:none !important } }
    ]]></style>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- Back swirl band (faint, slow) -->
  <g class="skyB" fill="none" opacity="0.4" stroke-linecap="round">
    <path class="current" d="M-40,120 C160,70 320,180 520,130 C720,80 880,185 1080,130 C1180,105 1240,140 1260,120"
          stroke="#6fa0ee" stroke-width="2.4"/>
    <path class="current" d="M-40,210 C180,170 360,250 560,205 C760,160 940,250 1140,205 C1200,192 1240,205 1260,200"
          stroke="#4f7fd6" stroke-width="2" style="animation-delay:-6s"/>
  </g>

  <!-- Main swirls (brighter, flowing) -->
  <g class="skyA" fill="none" stroke-linecap="round" opacity="0.72">
    <!-- central double spiral -->
    <path class="swirl" d="M300,150 C300,70 430,58 486,126 C542,194 452,258 374,232 C312,211 326,142 392,142 C436,142 448,186 414,198"
          stroke="#9cc1ff" stroke-width="3.4"/>
    <path class="swirl" d="M560,140 C560,64 686,58 740,126 C794,194 708,256 632,232 C572,213 584,146 648,146 C690,146 702,188 670,200"
          stroke="#b9d2ff" stroke-width="3" style="animation-delay:-4s"/>
    <!-- sweeping arcs -->
    <path class="swirl" d="M120,250 C300,196 520,224 660,286 C800,348 520,372 430,330"
          stroke="#6f9ff0" stroke-width="2.6" style="animation-delay:-7s"/>
    <path class="swirl" d="M820,250 C930,200 1060,214 1150,168"
          stroke="#9cc1ff" stroke-width="2.6" style="animation-delay:-2s"/>
    <path class="swirl" d="M70,150 C150,120 210,150 250,120"
          stroke="#8fbaf5" stroke-width="2.2" style="animation-delay:-5s"/>
  </g>

  <!-- Moon with pulsing halo + expanding ring -->
  <g transform="translate(1045,96)">
    <circle class="ring" r="40" fill="none" stroke="#ffe9a6" stroke-width="1.5"/>
    <circle class="halo" r="60" fill="url(#moonGlow)"/>
    <circle r="27" fill="#ffe9a6"/>
    <path d="M10,-22 A27,27 0 1 0 10,22 A20,20 0 1 1 10,-22 Z" fill="#fff4cf" opacity="0.65"/>
    <circle r="27" fill="#fff4cf" filter="url(#soft)" opacity="0.4"/>
  </g>

  <!-- Stars: glow + twinkle, with rays on the big ones -->
  <g>
    <g transform="translate(175,95)">
      <g class="halo"><g stroke="#fff6d5" stroke-width="1.4" opacity="0.7">
        <line x1="0" y1="-24" x2="0" y2="-14"/><line x1="0" y1="24" x2="0" y2="14"/>
        <line x1="-24" y1="0" x2="-14" y2="0"/><line x1="24" y1="0" x2="14" y2="0"/></g></g>
      <circle class="halo" r="28" fill="url(#starGlow)"/><circle class="star" r="5.5" fill="#fff8dc"/>
    </g>
    <g transform="translate(610,78)">
      <g class="halo" style="animation-delay:-2s"><g stroke="#fff6d5" stroke-width="1.4" opacity="0.7">
        <line x1="0" y1="-26" x2="0" y2="-15"/><line x1="0" y1="26" x2="0" y2="15"/>
        <line x1="-26" y1="0" x2="-15" y2="0"/><line x1="26" y1="0" x2="15" y2="0"/></g></g>
      <circle class="halo" r="30" fill="url(#starGlow)" style="animation-delay:-2s"/>
      <circle class="star" r="6" fill="#fff8dc" style="animation-delay:-1.4s"/>
    </g>
    <g transform="translate(330,72)"><circle class="halo" r="22" fill="url(#starGlow)" style="animation-delay:-1.5s"/><circle class="star" r="4.5" fill="#fff8dc" style="animation-delay:-.6s"/></g>
    <g transform="translate(470,118)"><circle class="halo" r="24" fill="url(#starGlow)" style="animation-delay:-2.4s"/><circle class="star" r="5" fill="#fff8dc" style="animation-delay:-1.1s"/></g>
    <g transform="translate(770,128)"><circle class="halo" r="20" fill="url(#starGlow)" style="animation-delay:-1s"/><circle class="star" r="4" fill="#fff8dc" style="animation-delay:-2.3s"/></g>
    <g transform="translate(895,74)"><circle class="halo" r="22" fill="url(#starGlow)" style="animation-delay:-3s"/><circle class="star" r="4.6" fill="#fff8dc" style="animation-delay:-.3s"/></g>
    <g transform="translate(250,185)"><circle class="star" r="2.8" fill="#ffeeb0" style="animation-delay:-1.1s"/></g>
    <g transform="translate(540,205)"><circle class="star" r="2.8" fill="#ffeeb0" style="animation-delay:-2.1s"/></g>
    <g transform="translate(705,195)"><circle class="star" r="2.6" fill="#ffeeb0" style="animation-delay:-.8s"/></g>
    <g transform="translate(965,190)"><circle class="star" r="2.8" fill="#ffeeb0" style="animation-delay:-1.7s"/></g>
    <g transform="translate(410,160)"><circle class="star" r="2.2" fill="#ffeeb0" style="animation-delay:-3.1s"/></g>
    <g transform="translate(830,180)"><circle class="star" r="2.2" fill="#ffeeb0" style="animation-delay:-2.7s"/></g>
  </g>

  <!-- Rolling hills -->
  <path d="M0,320 C180,286 360,336 560,308 C760,280 960,330 1200,300 L1200,420 L0,420 Z" fill="url(#hillGlow)"/>
  <g class="current" stroke="#2a4f93" stroke-width="2" fill="none" opacity="0.5">
    <path d="M40,330 C240,306 460,344 700,320 C900,300 1080,330 1180,318"/>
  </g>
  <path d="M0,352 C260,330 540,366 840,346 C1010,335 1120,356 1200,346 L1200,420 L0,420 Z" fill="#0a1a38"/>
  <path d="M0,384 C300,368 600,396 900,380 C1050,372 1140,388 1200,382 L1200,420 L0,420 Z" fill="#071027"/>

  <!-- Village with church -->
  <g fill="#05101f">
    <rect x="455" y="356" width="40" height="44"/>
    <polygon points="455,356 475,338 495,356"/>
    <rect x="500" y="364" width="32" height="36"/>
    <polygon points="500,364 516,350 532,364"/>
    <!-- church -->
    <rect x="545" y="344" width="30" height="56"/>
    <polygon points="545,344 560,320 575,344"/>
    <rect x="556" y="300" width="8" height="24"/>
    <polygon points="556,300 560,290 564,300"/>
    <rect x="558.5" y="286" width="3" height="8"/><rect x="556" y="289" width="8" height="2.4"/>
    <rect x="590" y="362" width="36" height="38"/>
    <polygon points="590,362 608,346 626,362"/>
    <rect x="632" y="368" width="30" height="32"/>
    <rect x="420" y="366" width="30" height="34"/>
    <polygon points="420,366 435,352 450,366"/>
    <rect x="668" y="372" width="26" height="28"/>
  </g>
  <!-- lit windows (some flicker) -->
  <g fill="#ffd877">
    <rect class="win" x="466" y="368" width="7" height="9"/>
    <rect class="win" x="509" y="376" width="6" height="7" style="animation-delay:-1.5s"/>
    <rect x="556" y="360" width="7" height="10"/>
    <rect class="win" x="600" y="374" width="7" height="8" style="animation-delay:-2.5s"/>
    <rect x="640" y="380" width="6" height="7"/>
    <rect class="win" x="428" y="378" width="6" height="7" style="animation-delay:-3.2s"/>
    <rect x="675" y="382" width="5" height="6"/>
  </g>

  <!-- Cypress trees (flame-like, swaying) -->
  <path class="cypA" d="M110,420 C78,344 150,300 104,232 C150,284 150,170 118,120
        C118,120 150,96 134,60 C170,120 166,200 150,268 C186,300 160,350 150,420 Z" fill="#071020"/>
  <path class="cypA" d="M150,420 C132,360 172,330 146,284 C176,316 172,250 156,214 C184,250 190,320 174,360 C196,380 182,420 174,420 Z"
        fill="#0a1526" opacity="0.9" style="animation-delay:-1.5s"/>
  <path class="cypB" d="M1010,420 C990,372 1024,348 1002,308 C1028,336 1026,286 1012,258 C1036,292 1040,348 1026,380 C1046,394 1034,420 1026,420 Z" fill="#081122"/>
</svg>
